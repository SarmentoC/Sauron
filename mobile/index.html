<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#110a06">
  <title>Sauron · Lord of Mordor</title>
  <link rel="stylesheet" href="./mobile.css">
  <script defer src="./mobile.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="bell" viewBox="0 0 24 24"><path d="M9 20a3 3 0 0 0 6 0M4 17c2-2 2-4 2-7a6 6 0 0 1 12 0c0 3 0 5 2 7z"/></symbol>
    <symbol id="calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-14 4h1m3 0h1m3 0h1m-9 3h1m3 0h1"/></symbol>
    <symbol id="scale" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 10a4 4 0 0 1 8 0l-4 4zM12 14l2-5"/></symbol>
    <symbol id="tower" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M5 3h3v3h2V3h4v3h2V3h3v7l-3 2 1 6 3 2v2H4v-2l3-2 1-6-3-2z"/></symbol>
    <symbol id="trend" viewBox="0 0 24 24"><path stroke-width="3" d="m3 19 7-8 4 3 6-8m-6 0h6v6"/></symbol>
    <symbol id="cross" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M8 2h8v6h6v8h-6v6H8v-6H2V8h6z"/></symbol>
    <symbol id="chart" viewBox="0 0 24 24"><path stroke-width="2.7" d="M5 20v-6m7 6V9m7 11V4"/></symbol>
  </svg>

  <div class="app">
    <header class="header">
      <button class="header-button" type="button" data-page="menu" aria-label="Abrir menu" aria-haspopup="dialog"><svg><use href="#menu"/></svg></button>
      <div class="brand">
        <img src="./assets/eye.webp" alt="" width="94" height="46">
        <h1>SAURON</h1>
        <p>LORD OF MORDOR</p>
      </div>
      <button class="header-button" type="button" data-page="events" aria-label="Eventos" aria-haspopup="dialog"><svg><use href="#bell"/></svg></button>
    </header>

    <main>
      <div class="portrait">
        <img class="portrait-photo" src="./assets/portrait.webp" alt="Retrato ilustrativo de um Maine Coon prateado">
        <div class="portrait-ring" aria-hidden="true"></div>
      </div>
      <div class="stats" aria-label="Idade e peso">
        <span><svg aria-hidden="true"><use href="#calendar"/></svg><span id="age">—</span></span>
        <span class="diamond" aria-hidden="true"></span>
        <span><svg aria-hidden="true"><use href="#scale"/></svg><span id="weight">Sem pesagem</span></span>
      </div>

      <section class="cards" aria-label="Secções principais">
        <button type="button" class="card card-plan" data-page="plan" aria-haspopup="dialog">
          <svg aria-hidden="true"><use href="#tower"/></svg><span>Plano<br>Diário</span><i aria-hidden="true"></i>
        </button>
        <button type="button" class="card card-growth" data-page="growth" aria-haspopup="dialog">
          <svg aria-hidden="true"><use href="#trend"/></svg><span>Crescimento</span><i aria-hidden="true"></i>
        </button>
        <button type="button" class="card card-health" data-page="health" aria-haspopup="dialog">
          <svg aria-hidden="true"><use href="#cross"/></svg><span>Saúde</span><i aria-hidden="true"></i>
        </button>
      </section>
    </main>

    <nav class="bottom" aria-label="Navegação principal">
      <button type="button" data-page="events" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#calendar"/></svg><span>Eventos</span></button>
      <button class="home-button" type="button" data-page="home" aria-current="page" aria-label="Home"><span class="home-eye"><img src="./assets/eye.webp" alt="" width="60" height="30"></span><span>Home</span></button>
      <button type="button" data-page="growth" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#chart"/></svg><span>Crescimento</span></button>
      <button type="button" data-page="menu" aria-haspopup="dialog"><svg aria-hidden="true"><use href="#menu"/></svg><span>Menu</span></button>
    </nav>
  </div>

  <dialog id="panel" aria-labelledby="panel-title">
    <div class="panel-content">
      <button class="close" type="button" data-page="close" aria-label="Fechar">×</button>
      <h2 id="panel-title"></h2>
      <p id="panel-status">Esta secção estará disponível numa próxima fase.</p>
      <div id="menu-items" hidden>
        <button type="button" data-page="events">Eventos</button>
        <button type="button" data-page="plan">Plano Diário</button>
        <button type="button" data-page="growth">Crescimento</button>
        <button type="button" data-page="health">Saúde</button>
        <button type="button" data-page="foods">Alimentos</button>
        <button type="button" data-page="training">Treinos</button>
        <button type="button" data-page="memories">Memórias</button>
        <button type="button" data-page="backup">Backup</button>
      </div>
      <button class="panel-home" type="button" data-page="home"><img src="./assets/eye.webp" alt="" width="34" height="17"> Voltar à Home</button>
    </div>
  </dialog>
</body>
</html>
